suite: VMAgent configuration
templates:
  - templates/vmagent.yaml
tests:
  - it: renders every remote write target and cluster-wide discovery
    set:
      remoteWrite:
        - url: https://prometheus.example.com/api/v1/write
        - url: https://backup.example.com/api/v1/write
    asserts:
      - isKind:
          of: VMAgent
      - equal:
          path: spec.selectAllByDefault
          value: true
      - lengthEqual:
          path: spec.remoteWrite
          count: 2
      - equal:
          path: spec.remoteWrite[0].url
          value: https://prometheus.example.com/api/v1/write
      - equal:
          path: spec.useStrictSecurity
          value: true

  - it: lets vmagent.spec override generated defaults
    set:
      remoteWrite:
        - url: https://prometheus.example.com/api/v1/write
      vmagent:
        spec:
          scrapeInterval: 15s
          shardCount: 3
    asserts:
      - equal:
          path: spec.scrapeInterval
          value: 15s
      - equal:
          path: spec.shardCount
          value: 3

  - it: enables approximate series tracking only when requested
    set:
      remoteWrite:
        - url: https://prometheus.example.com/api/v1/write
      metricsSeriesTracking:
        enabled: true
    asserts:
      - equal:
          path: spec.extraArgs.remoteWrite.maxHourlySeries
          value: "-1"
      - equal:
          path: spec.extraArgs.remoteWrite.maxDailySeries
          value: "-1"
