name: Security and quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # reviewed 2026-08-02
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Install dependency scanners
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: Scan repository history for secrets
        run: docker run --rm --volume "${PWD}:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:6b2d52241f9d176fc59e6e3b026ea52c98f390070587d9475d6ee2bc64941815 git /repo --redact --no-banner

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Scan RustSec advisories
        run: cargo audit

      - name: Enforce dependency policy
        run: cargo deny check --hide-inclusion-graph advisories bans licenses sources

      - name: Build container for scanning
        run: docker build --tag metrics-agent:security .

      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: metrics-agent:security
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
