name: Release metrics-agent

on:
  push:
    tags:
      - '**'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.tag.outputs.release }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Check tag
        id: tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"

          if [[ "${tag}" == helm-* ]]; then
            echo "Ignoring Helm tag ${tag}"
            echo "release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${tag}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release=true" >> "${GITHUB_OUTPUT}"
            echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Ignoring non-semver tag ${tag}"
          echo "release=false" >> "${GITHUB_OUTPUT}"

  security-gate:
    name: Security release gate
    needs: validate-tag
    if: needs.validate-tag.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # reviewed 2026-08-02
        with:
          toolchain: 1.85.0

      - name: Install dependency scanners
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: Scan repository history for secrets
        run: docker run --rm --volume "${PWD}:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner

      - name: Scan dependencies and build release target
        run: |
          cargo audit
          cargo deny check --hide-inclusion-graph advisories bans licenses sources
          cargo test --all-targets --all-features --locked
          cargo build --release --locked

  build:
    name: Build ${{ matrix.arch }}
    needs: [validate-tag, security-gate]
    if: needs.validate-tag.outputs.release == 'true' && needs.security-gate.result == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust target and ARM linker
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            sudo apt-get update
            sudo apt-get install --yes gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "${GITHUB_ENV}"
          fi

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package release binary
        shell: bash
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          package="metrics-agent-${VERSION}-${{ matrix.arch }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/metrics-agent" "dist/${package}"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          sha256sum "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"

      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metrics-agent-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - validate-tag
      - build
    if: needs.validate-tag.outputs.release == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Build and push multi-architecture image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.validate-tag.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.validate-tag.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true

      - name: Scan immutable image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Attest image build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: metrics-agent-${{ github.ref_name }}.spdx.json
          upload-artifact: true
          artifact-name: metrics-agent-${{ github.ref_name }}-image-sbom
          upload-release-assets: false

      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: metrics-agent-${{ github.ref_name }}.spdx.json
          push-to-registry: true

      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: metrics-agent-*
          path: release-assets
          merge-multiple: true

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/metrics-agent-${{ github.ref_name }}.spdx.json
          upload-artifact: false

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*.tar.gz

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*.tar.gz
          sbom-path: release-assets/metrics-agent-${{ github.ref_name }}.spdx.json

      - name: Publish release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          name: metrics-agent ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/*.spdx.json
