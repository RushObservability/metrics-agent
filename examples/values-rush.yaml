# Create this Secret before installing the chart:
# kubectl -n monitoring create secret generic rush-remote-write \
#   --from-literal=token='your_64_character_tenant_api_key'
rushRemoteWrite:
  enabled: true
  url: http://rush-query-api.monitoring.svc.cluster.local:8080/prom/api/v1/write
  # Optional for open tenants; locked tenants should use a tenant-scoped token.
  tenant: ""
  bearerTokenSecret:
    name: rush-remote-write
    key: token

# vmagent remains disabled by default. The Rust agent discovers scrape targets
# from the CRDs, scrapes them, and sends workload plus health metrics directly
# to Rush.
