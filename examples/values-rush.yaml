# Create this Secret before installing the chart:
# kubectl -n monitoring create secret generic rush-remote-write \
#   --from-literal=token='rush_ing_...'
rushRemoteWrite:
  enabled: true
  allowAnonymous: false
  url: http://rush-query-api.monitoring.svc.cluster.local:8080/prom/api/v1/write
  # Optional routing hint; the metrics-scoped ingest key remains authoritative.
  tenant: ""
  bearerTokenSecret:
    name: rush-remote-write
    key: token

# The Rust agent discovers scrape targets from the CRDs, scrapes them, and sends
# workload plus health metrics directly to Rush.
