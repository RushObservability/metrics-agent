suite: Deployment security defaults
templates:
  - templates/deployment.yaml
tests:
  - it: renders one hardened controller pod by default
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
      - equal:
          path: spec.template.spec.hostNetwork
          value: false
      - equal:
          path: spec.template.spec.hostPID
          value: false
      - equal:
          path: spec.template.spec.hostIPC
          value: false
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.privileged
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
      - contains:
          path: spec.template.spec.containers[0].args
          content: --scrape-max-response-bytes=4194304
      - contains:
          path: spec.template.spec.containers[0].args
          content: --scrape-max-samples-per-target=50000
      - contains:
          path: spec.template.spec.containers[0].args
          content: --scrape-discovery-refresh-interval=60s
      - contains:
          path: spec.template.spec.containers[0].args
          content: --scrape-concurrency=8
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUSH_REMOTE_WRITE_TIMEOUT
            value: "30s"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUSH_REMOTE_WRITE_CONNECT_TIMEOUT
            value: "5s"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_AGENT_UI_ENABLED
            value: "false"

  - it: supports immutable image references
    set:
      image:
        repository: ghcr.io/rushobservability/metrics-agent
        digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/rushobservability/metrics-agent@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  - it: renders extra labels for every remote-write series
    set:
      extraLabels:
        env: dev
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_AGENT_EXTRA_LABELS
            value: '{"env":"dev"}'
