{{- if .Values.precedence.enabled }}
{{- if ne (.Values.replicaCount | int) 1 }}
{{- fail "replicaCount must be exactly 1 until metrics-agent supports leader election" }}
{{- end }}
{{- if and .Values.rushRemoteWrite.enabled (not .Values.rushRemoteWrite.url) }}
{{- fail "rushRemoteWrite.url is required when rushRemoteWrite.enabled=true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metrics-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metrics-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "metrics-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "metrics-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "metrics-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      hostNetwork: {{ .Values.hostNetwork }}
      hostPID: {{ .Values.hostPID }}
      hostIPC: {{ .Values.hostIPC }}
      shareProcessNamespace: {{ .Values.shareProcessNamespace }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: metrics-agent
          image: {{ include "metrics-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --http-address=:{{ include "metrics-agent.httpPort" . }}
            - --log-level={{ .Values.controller.logLevel }}
            - --resync-period={{ .Values.controller.resyncPeriod }}
            - --workers={{ .Values.controller.workers }}
            - --scrape-enabled={{ .Values.scrape.enabled }}
            - --scrape-interval={{ .Values.scrape.interval }}
            - --scrape-timeout={{ .Values.scrape.timeout }}
          env:
            - name: METRICS_AGENT_UI_ENABLED
              value: {{ .Values.ui.enabled | quote }}
            - name: METRICS_AGENT_UI_ADDRESS
              value: {{ default (printf "0.0.0.0:%s" (include "metrics-agent.httpPort" .)) .Values.ui.address | quote }}
            - name: METRICS_AGENT_UI_PATH
              value: {{ .Values.ui.path | quote }}
            {{- if .Values.rushRemoteWrite.enabled }}
            {{- if and (not .Values.rushRemoteWrite.bearerTokenSecret.name) (not .Values.rushRemoteWrite.allowAnonymous) }}
            {{- fail "rushRemoteWrite.bearerTokenSecret.name is required when Rush remote write is enabled" }}
            {{- end }}
            - name: RUSH_REMOTE_WRITE_URL
              value: {{ .Values.rushRemoteWrite.url | quote }}
            - name: RUSH_REMOTE_WRITE_INTERVAL
              value: {{ .Values.rushRemoteWrite.interval | quote }}
            {{- if .Values.rushRemoteWrite.tenant }}
            - name: RUSH_REMOTE_WRITE_TENANT
              value: {{ .Values.rushRemoteWrite.tenant | quote }}
            {{- end }}
            {{- with .Values.rushRemoteWrite.bearerTokenSecret }}
            {{- if .name }}
            - name: RUSH_REMOTE_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .name | quote }}
                  key: {{ .key | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ include "metrics-agent.httpPort" . }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.status.livenessPath | quote }}
              port: http
          readinessProbe:
            httpGet:
              path: {{ .Values.status.readinessPath | quote }}
              port: http
          startupProbe:
            httpGet:
              path: {{ .Values.status.readinessPath | quote }}
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
