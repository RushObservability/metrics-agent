{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "metrics-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metrics-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "metrics-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
  egress:
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and .Values.sreMetrics.enabled .Values.scrape.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ default .Release.Namespace .Values.sreMetrics.discovery.namespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: sre-agent
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: http
    {{- else if not .Values.networkPolicy.egress }}
    []
    {{- end }}
{{- end }}
