[package]
name = "metrics-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Kubernetes controller for metrics scrape configuration precedence"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
humantime = "2"
k8s-openapi = { version = "0.26", features = ["v1_32"] }
kube = { version = "2.0", features = ["client", "runtime", "rustls-tls"] }
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
snap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
